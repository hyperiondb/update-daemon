[workspace]
resolver = "2"
members = [
    "crates/renew-core",
    "crates/renew",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Tadas Talaikis <info@nordlet.com>"]
repository = "https://github.com/hyperiondb/renew"
homepage = "https://hyperiondb.eu/"
readme = "README.md"
keywords = ["daemon", "deployment", "docker-compose", "cron", "self-healing"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "process", "time", "sync", "signal", "fs", "io-util"] }
thiserror = "=2.0.18"
anyhow = "=1.0.102"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
time = { version = "=0.3.49", features = ["formatting", "macros"] }
sha2 = "=0.11.0"
clap = { version = "=4.6.1", features = ["derive", "env"] }
reqwest = { version = "=0.12.23", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "=0.1.89"
renew-core = { path = "crates/renew-core", version = "=0.1.0" }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
